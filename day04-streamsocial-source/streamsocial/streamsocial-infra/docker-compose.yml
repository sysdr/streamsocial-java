# StreamSocial Kafka cluster - Day 2.
#
# 3 brokers, KRaft mode, no Zookeeper. Each node runs combined
# broker+controller roles, which is the standard shape for a small
# development/teaching cluster - production clusters usually split
# dedicated controller nodes out once you're past a handful of brokers,
# a distinction Day 20 (Replication & ISR Management) comes back to.
#
# All three nodes vote in the same controller quorum
# (KAFKA_CONTROLLER_QUORUM_VOTERS), which is what makes controller
# failover something you can actually demonstrate today: kill whichever
# container is currently the active controller and the remaining two
# voters elect a new one without the cluster going down.

name: streamsocial

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.7.1
  networks:
    - streamsocial-net
  environment: &kafka-common-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    # Fixed cluster ID so all three nodes format their storage as one
    # cluster on first boot. Same 16-byte base64 UUID format Kafka's own
    # kafka-storage.sh random-uuid generates - hardcoded here so the
    # compose file is fully reproducible across runs.
    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    container_name: streamsocial-kafka-1
    ports:
      - "29092:29092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka-1:9092,CONTROLLER://kafka-1:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:29092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      # PLAINTEXT binds to the container hostname, not 127.0.0.1
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-1:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    container_name: streamsocial-kafka-2
    ports:
      - "29093:29093"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://kafka-2:9092,CONTROLLER://kafka-2:9093,PLAINTEXT_HOST://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,PLAINTEXT_HOST://localhost:29093
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-2:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    container_name: streamsocial-kafka-3
    ports:
      - "29094:29094"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://kafka-3:9092,CONTROLLER://kafka-3:9093,PLAINTEXT_HOST://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,PLAINTEXT_HOST://localhost:29094
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-3:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

networks:
  streamsocial-net:
    name: streamsocial-net

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
