<svg viewBox="0 0 700 780" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D3E7FB"/>
      <stop offset="100%" stop-color="#A9CDF3"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0C2"/>
      <stop offset="100%" stop-color="#FFC38A"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFF3DE"/>
      <stop offset="100%" stop-color="#A0E4C0"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD9D2"/>
      <stop offset="100%" stop-color="#FFB3A6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="780" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#2A2E35">Per-record processing, underneath @KafkaListener</text>

  <rect x="230" y="56" width="240" height="48" rx="24" fill="url(#blueGrad)" filter="url(#softShadow)"/>
  <text x="350" y="80" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#1E4A7A">container.poll() gets a batch</text>

  <line x1="350" y1="104" x2="350" y2="136" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="136" width="220" height="46" rx="14" fill="url(#orangeGrad)" filter="url(#softShadow)"/>
  <text x="350" y="159" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#7A4A1E">JsonDeserializer.deserialize()</text>

  <line x1="350" y1="182" x2="350" y2="216" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision: valid -->
  <g transform="translate(350,282)">
    <polygon points="0,-62 138,0 0,62 -138,0" fill="#FBFBFB" stroke="#5B6472" stroke-width="1.8" filter="url(#strongShadow)"/>
    <text x="0" y="-4" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#2A2E35">Validator.validate()</text>
    <text x="0" y="14" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#2A2E35">passes?</text>
  </g>

  <line x1="212" y1="282" x2="130" y2="282" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="270" text-anchor="middle" font-size="10" fill="#8A4A3E" font-weight="600">no</text>

  <line x1="488" y1="282" x2="560" y2="282" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="524" y="270" text-anchor="middle" font-size="10" fill="#2E6B4B" font-weight="600">yes</text>

  <!-- second decision: poison -->
  <g transform="translate(560,282)">
    <polygon points="0,-56 110,0 0,56 -110,0" fill="#FBFBFB" stroke="#5B6472" stroke-width="1.8" filter="url(#strongShadow)"/>
    <text x="0" y="-4" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="700" fill="#2A2E35">contentId ==</text>
    <text x="0" y="12" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="700" fill="#2A2E35">post-BOOM?</text>
  </g>

  <path d="M 560,338 C 560,400 470,420 350,420" fill="none" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="410" text-anchor="middle" font-size="10" fill="#8A4A3E" font-weight="600">yes (demo hook)</text>

  <line x1="560" y1="226" x2="470" y2="120" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="170" text-anchor="middle" font-size="10" fill="#2E6B4B" font-weight="600">no</text>

  <rect x="330" y="94" width="200" height="46" rx="14" fill="url(#greenGrad)" filter="url(#softShadow)"/>
  <text x="430" y="117" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#1E5B3B">log STRUCTURED_EVENT, processed.add()</text>

  <!-- both failure paths converge on throw -->
  <rect x="20" y="400" width="220" height="46" rx="14" fill="url(#redGrad)" filter="url(#softShadow)"/>
  <text x="130" y="423" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#6B2E24">throw exception</text>
  <line x1="130" y1="234" x2="130" y2="400" stroke="#C9776A" stroke-width="2"/>
  <line x1="240" y1="420" x2="330" y2="420" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="396" width="140" height="46" rx="14" fill="url(#redGrad)" filter="url(#softShadow)"/>
  <text x="400" y="419" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#6B2E24">throw</text>

  <line x1="400" y1="442" x2="400" y2="490" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="490" width="280" height="60" rx="16" fill="#FBFBFB" stroke="#5B6472" stroke-width="1.6" filter="url(#strongShadow)"/>
  <text x="400" y="512" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#2A2E35">DefaultErrorHandler catches it</text>
  <text x="400" y="530" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#5B6472">seeks record back, applies FixedBackOff</text>

  <line x1="400" y1="550" x2="400" y2="586" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(400,650)">
    <polygon points="0,-56 120,0 0,56 -120,0" fill="#FBFBFB" stroke="#5B6472" stroke-width="1.8" filter="url(#strongShadow)"/>
    <text x="0" y="-4" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#2A2E35">retries left</text>
    <text x="0" y="12" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#2A2E35">(max 2)?</text>
  </g>

  <path d="M 340,610 C 260,560 260,500 330,470" fill="none" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="540" text-anchor="middle" font-size="9.5" fill="#2E6B4B" font-weight="600">yes — redeliver</text>

  <line x1="520" y1="650" x2="590" y2="650" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="624" width="90" height="52" rx="14" fill="url(#redGrad)" filter="url(#softShadow)"/>
  <text x="635" y="644" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="700" fill="#6B2E24">RecoveryTracker</text>
  <text x="635" y="660" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#6B2E24">logs + counts</text>
  <text x="560" y="638" text-anchor="middle" font-size="9.5" fill="#8A4A3E" font-weight="600">no</text>

  <text x="350" y="740" text-anchor="middle" font-size="11" fill="#5B6472">Every path either processes the record or hands it to RecoveryTracker — none silently vanish.</text>
</svg>
