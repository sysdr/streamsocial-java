<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.26"/>
    </filter>
    <radialGradient id="blueGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#E3F0FD"/>
      <stop offset="100%" stop-color="#A9CDF3"/>
    </radialGradient>
    <radialGradient id="orangeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFEBD6"/>
      <stop offset="100%" stop-color="#FFC38A"/>
    </radialGradient>
    <radialGradient id="greenGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#DFF8E9"/>
      <stop offset="100%" stop-color="#9EE3BE"/>
    </radialGradient>
    <radialGradient id="redGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFE6E1"/>
      <stop offset="100%" stop-color="#FFB3A6"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#2A2E35">A record's state from receipt to resolution</text>

  <!-- RECEIVED -->
  <circle cx="100" cy="230" r="60" fill="url(#blueGrad)" filter="url(#strongShadow)"/>
  <text x="100" y="224" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#1E4A7A">RECEIVED</text>
  <text x="100" y="242" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#1E4A7A">from poll()</text>

  <line x1="160" y1="230" x2="230" y2="230" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PROCESSING -->
  <circle cx="300" cy="230" r="60" fill="url(#orangeGrad)" filter="url(#strongShadow)"/>
  <text x="300" y="222" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#7A4A1E">PROCESSING</text>
  <text x="300" y="240" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#7A4A1E">deserialize + validate</text>

  <line x1="352" y1="182" x2="410" y2="110" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="352" y1="278" x2="410" y2="330" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PROCESSED -->
  <circle cx="480" cy="90" r="60" fill="url(#greenGrad)" filter="url(#strongShadow)"/>
  <text x="480" y="82" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#1E5B3B">PROCESSED</text>
  <text x="480" y="100" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#1E5B3B">logged, offset commits</text>
  <text x="380" y="140" text-anchor="middle" font-size="9" fill="#2E6B4B" font-weight="600">ok</text>

  <!-- FAILED -->
  <circle cx="480" cy="360" r="56" fill="url(#redGrad)" filter="url(#strongShadow)"/>
  <text x="480" y="352" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#6B2E24">FAILED</text>
  <text x="480" y="370" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#6B2E24">exception thrown</text>
  <text x="390" y="308" text-anchor="middle" font-size="9" fill="#8A4A3E" font-weight="600">invalid / poisoned</text>

  <line x1="536" y1="345" x2="600" y2="300" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RETRYING -->
  <circle cx="670" cy="260" r="58" fill="url(#orangeGrad)" filter="url(#strongShadow)"/>
  <text x="670" y="252" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#7A4A1E">RETRYING</text>
  <text x="670" y="270" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#7A4A1E">seek back, 1s backoff</text>

  <path d="M 690,204 C 700,150 620,150 610,190" fill="none" stroke="#8592A6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="700" y="165" text-anchor="middle" font-size="8.5" fill="#5B6472">attempt 1 of 2</text>

  <line x1="726" y1="230" x2="790" y2="180" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="775" y="200" text-anchor="middle" font-size="9" fill="#8A4A3E" font-weight="600">retries exhausted</text>

  <!-- RECOVERED -->
  <circle cx="820" cy="130" r="58" fill="#F1F3F5" stroke="#B9C0CA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="820" y="122" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#5B6472">RECOVERED</text>
  <text x="820" y="140" text-anchor="middle" dominant-baseline="middle" font-size="8" fill="#8A93A0">logged + counted,</text>
  <text x="820" y="152" text-anchor="middle" dominant-baseline="middle" font-size="8" fill="#8A93A0">DLQ arrives Day 25</text>

  <text x="450" y="430" text-anchor="middle" font-size="11" fill="#5B6472">RETRYING can loop back to PROCESSING (redelivered) before finally reaching RECOVERED — never a silent drop.</text>
</svg>
