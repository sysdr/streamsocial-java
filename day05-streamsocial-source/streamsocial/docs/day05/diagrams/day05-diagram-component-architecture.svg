<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.30"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D3E7FB"/>
      <stop offset="100%" stop-color="#A9CDF3"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFF3DE"/>
      <stop offset="100%" stop-color="#A0E4C0"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD9D2"/>
      <stop offset="100%" stop-color="#FFB3A6"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3FBF6"/>
      <stop offset="100%" stop-color="#E4F5EA"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#2A2E35">The first consumer reads content-interactions</text>

  <!-- test data generator, dashed/temporary -->
  <rect x="40" y="60" width="220" height="56" rx="14" fill="#F1F3F5" stroke="#B9C0CA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="150" y="82" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#5B6472">EngagementTestDataGenerator</text>
  <text x="150" y="98" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#8A93A0">demo scaffolding, not a lesson deliverable</text>

  <line x1="260" y1="88" x2="330" y2="88" stroke="#B9C0CA" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- topic -->
  <rect x="330" y="60" width="240" height="56" rx="14" fill="url(#blueGrad)" filter="url(#softShadow)"/>
  <text x="450" y="80" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#1E4A7A">content-interactions</text>
  <text x="450" y="96" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#1E4A7A">Day 3, 500 partitions</text>

  <line x1="450" y1="116" x2="450" y2="150" stroke="#5FAE84" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- TODAY panel -->
  <g transform="translate(150,150)">
    <rect x="0" y="0" width="600" height="380" rx="22" fill="url(#baseGrad)" stroke="#B7E0C6" stroke-width="1.5" filter="url(#strongShadow)"/>
    <text x="300" y="30" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#1E5B3B">TODAY — streamsocial-engagement-consumer</text>
    <text x="300" y="48" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#3F6E58">group.id = engagement-consumer, no web server</text>

    <rect x="40" y="70" width="230" height="56" rx="14" fill="#ffffff" stroke="#7CB69A" stroke-width="1.6" filter="url(#softShadow)"/>
    <text x="155" y="92" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#1E5B3B">JsonDeserializer</text>
    <text x="155" y="108" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#3F6E58">ContentInteractionEvent, no header</text>

    <rect x="330" y="70" width="230" height="56" rx="14" fill="#ffffff" stroke="#7CB69A" stroke-width="1.6" filter="url(#softShadow)"/>
    <text x="445" y="92" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#1E5B3B">jakarta.validation.Validator</text>
    <text x="445" y="108" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#3F6E58">Day 1's rules, reused</text>

    <line x1="155" y1="126" x2="300" y2="160" stroke="#8592A6" stroke-width="1.6"/>
    <line x1="445" y1="126" x2="300" y2="160" stroke="#8592A6" stroke-width="1.6"/>

    <rect x="170" y="160" width="260" height="60" rx="16" fill="url(#greenGrad)" filter="url(#strongShadow)"/>
    <text x="300" y="182" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#1E5B3B">EngagementEventListener</text>
    <text x="300" y="200" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1E5B3B">@KafkaListener, structured logging</text>

    <line x1="300" y1="220" x2="300" y2="252" stroke="#8592A6" stroke-width="1.6"/>
    <line x1="300" y1="252" x2="180" y2="280" stroke="#5FAE84" stroke-width="1.8" marker-end="url(#arrow)"/>
    <line x1="300" y1="252" x2="420" y2="280" stroke="#C9776A" stroke-width="1.8" marker-end="url(#arrow)"/>

    <rect x="60" y="280" width="200" height="60" rx="14" fill="#ffffff" stroke="#7CB69A" stroke-width="1.6" filter="url(#softShadow)"/>
    <text x="160" y="302" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#1E5B3B">processed (success)</text>
    <text x="160" y="318" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#3F6E58">STRUCTURED_EVENT log</text>

    <rect x="340" y="280" width="200" height="60" rx="14" fill="url(#redGrad)" filter="url(#softShadow)"/>
    <text x="440" y="300" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#6B2E24">DefaultErrorHandler</text>
    <text x="440" y="316" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#6B2E24">retry → RecoveryTracker</text>
  </g>

  <text x="450" y="570" text-anchor="middle" font-size="11" fill="#5B6472">DefaultErrorHandler replaces the removed SeekToCurrentErrorHandler — same seek-and-retry contract, current API.</text>
</svg>
