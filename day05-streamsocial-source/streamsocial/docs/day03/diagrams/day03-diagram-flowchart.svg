<svg viewBox="0 0 760 680" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D3E7FB"/>
      <stop offset="100%" stop-color="#A9CDF3"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0C2"/>
      <stop offset="100%" stop-color="#FFC38A"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFF3DE"/>
      <stop offset="100%" stop-color="#A0E4C0"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD9D2"/>
      <stop offset="100%" stop-color="#FFB3A6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="680" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#2A2E35">TopicBootstrapper decision flow, per topic</text>

  <rect x="260" y="56" width="240" height="48" rx="24" fill="url(#blueGrad)" filter="url(#softShadow)"/>
  <text x="380" y="80" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="600" fill="#1E4A7A">adminClient.listTopics()</text>

  <line x1="380" y1="104" x2="380" y2="140" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision: exists -->
  <g transform="translate(380,210)">
    <polygon points="0,-66 140,0 0,66 -140,0" fill="#FBFBFB" stroke="#5B6472" stroke-width="1.8" filter="url(#strongShadow)"/>
    <text x="0" y="-6" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#2A2E35">topic name already</text>
    <text x="0" y="12" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#2A2E35">exists on cluster?</text>
  </g>

  <!-- no -> create -->
  <line x1="240" y1="210" x2="150" y2="210" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="198" text-anchor="middle" font-size="10" fill="#8A4A3E" font-weight="600">no</text>

  <rect x="-10" y="184" width="160" height="52" rx="14" fill="url(#orangeGrad)" filter="url(#softShadow)"/>
  <text x="70" y="204" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#7A4A1E">createTopics()</text>
  <text x="70" y="220" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#7A4A1E">with catalog spec</text>

  <line x1="70" y1="236" x2="70" y2="280" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="-10" y="280" width="160" height="44" rx="14" fill="url(#greenGrad)" filter="url(#softShadow)"/>
  <text x="70" y="302" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#1E5B3B">CREATED</text>

  <!-- yes -> describe -->
  <line x1="520" y1="210" x2="610" y2="210" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="198" text-anchor="middle" font-size="10" fill="#2E6B4B" font-weight="600">yes</text>

  <rect x="610" y="184" width="150" height="52" rx="14" fill="url(#blueGrad)" filter="url(#softShadow)"/>
  <text x="685" y="204" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#1E4A7A">describeTopics()</text>
  <text x="685" y="220" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#1E4A7A">read actual partitions</text>

  <line x1="685" y1="236" x2="685" y2="280" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- second decision: matches -->
  <g transform="translate(685,350)">
    <polygon points="0,-58 120,0 0,58 -120,0" fill="#FBFBFB" stroke="#5B6472" stroke-width="1.8" filter="url(#strongShadow)"/>
    <text x="0" y="-4" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#2A2E35">partitions match</text>
    <text x="0" y="12" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#2A2E35">the catalog spec?</text>
  </g>

  <line x1="605" y1="350" x2="540" y2="330" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="316" text-anchor="middle" font-size="10" fill="#2E6B4B" font-weight="600">yes</text>
  <rect x="420" y="304" width="120" height="46" rx="14" fill="url(#greenGrad)" filter="url(#softShadow)"/>
  <text x="480" y="327" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#1E5B3B">VERIFIED</text>

  <line x1="685" y1="408" x2="685" y2="460" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="725" y="434" text-anchor="middle" font-size="10" fill="#8A4A3E" font-weight="600">no</text>
  <rect x="605" y="460" width="160" height="60" rx="14" fill="url(#redGrad)" filter="url(#softShadow)"/>
  <text x="685" y="482" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#6B2E24">MISMATCHED</text>
  <text x="685" y="500" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#6B2E24">reported, not auto-fixed</text>

  <text x="380" y="600" text-anchor="middle" font-size="11" fill="#5B6472">Run twice: first run mostly hits CREATED, second run hits VERIFIED for the same topics — nothing recreated.</text>
</svg>
