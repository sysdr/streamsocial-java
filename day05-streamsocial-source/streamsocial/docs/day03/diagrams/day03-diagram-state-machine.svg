<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.26"/>
    </filter>
    <radialGradient id="blueGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#E3F0FD"/>
      <stop offset="100%" stop-color="#A9CDF3"/>
    </radialGradient>
    <radialGradient id="orangeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFEBD6"/>
      <stop offset="100%" stop-color="#FFC38A"/>
    </radialGradient>
    <radialGradient id="greenGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#DFF8E9"/>
      <stop offset="100%" stop-color="#9EE3BE"/>
    </radialGradient>
    <radialGradient id="redGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFE6E1"/>
      <stop offset="100%" stop-color="#FFB3A6"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#2A2E35">A topic's state from the bootstrapper's point of view</text>

  <!-- UNKNOWN -->
  <circle cx="120" cy="210" r="64" fill="url(#blueGrad)" filter="url(#strongShadow)"/>
  <text x="120" y="204" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="700" fill="#1E4A7A">UNKNOWN</text>
  <text x="120" y="222" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#1E4A7A">before listTopics()</text>

  <line x1="184" y1="210" x2="256" y2="210" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="198" text-anchor="middle" font-size="9.5" fill="#5B6472">listTopics()</text>

  <!-- decision-ish split into MISSING / PRESENT states -->
  <circle cx="340" cy="120" r="58" fill="url(#orangeGrad)" filter="url(#strongShadow)"/>
  <text x="340" y="114" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#7A4A1E">MISSING</text>
  <text x="340" y="132" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#7A4A1E">name not found</text>

  <circle cx="340" cy="300" r="58" fill="url(#blueGrad)" filter="url(#strongShadow)"/>
  <text x="340" y="294" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#1E4A7A">PRESENT</text>
  <text x="340" y="312" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#1E4A7A">name found</text>

  <path d="M 175,180 C 230,155 280,140 292,130" fill="none" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 175,240 C 230,265 280,280 292,290" fill="none" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MISSING -> CREATED -->
  <line x1="398" y1="120" x2="470" y2="120" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="560" cy="120" r="60" fill="url(#greenGrad)" filter="url(#strongShadow)"/>
  <text x="560" y="112" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#1E5B3B">CREATED</text>
  <text x="560" y="130" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#1E5B3B">createTopics() ok</text>

  <!-- PRESENT -> describeTopics -> VERIFIED or MISMATCHED -->
  <line x1="398" y1="300" x2="470" y2="300" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="434" y="288" text-anchor="middle" font-size="9" fill="#5B6472">describeTopics()</text>

  <circle cx="560" cy="260" r="54" fill="url(#greenGrad)" filter="url(#strongShadow)"/>
  <text x="560" y="253" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#1E5B3B">VERIFIED</text>
  <text x="560" y="270" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#1E5B3B">partitions match</text>

  <circle cx="700" cy="340" r="54" fill="url(#redGrad)" filter="url(#strongShadow)"/>
  <text x="700" y="333" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#6B2E24">MISMATCHED</text>
  <text x="700" y="350" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#6B2E24">needs a human</text>

  <path d="M 500,290 C 530,275 545,268 512,265" fill="none" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 500,310 C 560,330 620,335 646,338" fill="none" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="410" y="392" text-anchor="middle" font-size="11" fill="#5B6472">Every subsequent run starts from UNKNOWN again — the cluster's actual state is always re-read, never assumed.</text>
</svg>
