<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.30"/>
    </filter>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFEBD6"/>
      <stop offset="100%" stop-color="#FFC38A"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFF3DE"/>
      <stop offset="100%" stop-color="#A0E4C0"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D3E7FB"/>
      <stop offset="100%" stop-color="#A9CDF3"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FFEBD9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#2A2E35">From event taxonomy to topics on the cluster</text>

  <!-- Day 1 foundation, faded -->
  <rect x="30" y="56" width="200" height="56" rx="14" fill="#F1F3F5" stroke="#B9C0CA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="130" y="78" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#5B6472">DomainEvent taxonomy</text>
  <text x="130" y="94" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#8A93A0">streamsocial-common — Day 1</text>

  <!-- TODAY panel: admin package -->
  <g transform="translate(30,140)">
    <rect x="0" y="0" width="380" height="200" rx="20" fill="url(#baseGrad)" stroke="#F0C79A" stroke-width="1.5" filter="url(#strongShadow)"/>
    <text x="190" y="28" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#7A4A1E">TODAY — admin package</text>
    <text x="190" y="46" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#8A5A2C">streamsocial-common, first kafka-clients use</text>

    <rect x="24" y="66" width="150" height="52" rx="12" fill="#ffffff" stroke="#F0A85A" stroke-width="1.6" filter="url(#softShadow)"/>
    <text x="99" y="86" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#7A4A1E">TopicSpec</text>
    <text x="99" y="102" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#7A4A1E">name · partitions · rf</text>

    <rect x="206" y="66" width="150" height="52" rx="12" fill="#ffffff" stroke="#F0A85A" stroke-width="1.6" filter="url(#softShadow)"/>
    <text x="281" y="86" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#7A4A1E">StreamSocialTopics</text>
    <text x="281" y="102" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#7A4A1E">catalog of 2 specs</text>

    <rect x="90" y="140" width="200" height="48" rx="12" fill="url(#orangeGrad)" filter="url(#softShadow)"/>
    <text x="190" y="160" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#7A4A1E">TopicBootstrapper</text>
    <text x="190" y="176" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#7A4A1E">idempotent, AdminClient</text>
  </g>

  <line x1="130" y1="112" x2="130" y2="140" stroke="#B9C0CA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="410" y1="240" x2="470" y2="240" stroke="#5FAE84" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="440" y="228" text-anchor="middle" font-size="9" fill="#3F6E58">creates / verifies</text>

  <!-- Cluster panel with 2 topics -->
  <g transform="translate(470,140)">
    <rect x="0" y="0" width="400" height="380" rx="20" fill="#F3FBF6" stroke="#B7E0C6" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="200" y="28" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1E5B3B">streamsocial-infra cluster (Day 2)</text>
    <text x="200" y="46" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#3F6E58">3 brokers, replication factor 3</text>

    <rect x="30" y="70" width="340" height="120" rx="16" fill="url(#blueGrad)" filter="url(#softShadow)"/>
    <text x="200" y="96" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="700" fill="#1E4A7A">user-actions</text>
    <text x="200" y="118" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="700" fill="#1E4A7A">1000 partitions</text>
    <text x="200" y="140" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1E4A7A">keyed by userId — even key spread</text>
    <text x="200" y="156" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1E4A7A">30M events/sec assumed peak</text>
    <text x="200" y="176" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#1E4A7A">Day 4 producer target</text>

    <rect x="30" y="210" width="340" height="120" rx="16" fill="url(#greenGrad)" filter="url(#softShadow)"/>
    <text x="200" y="236" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="700" fill="#1E5B3B">content-interactions</text>
    <text x="200" y="258" text-anchor="middle" dominant-baseline="middle" font-size="20" font-weight="700" fill="#1E5B3B">500 partitions</text>
    <text x="200" y="280" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1E5B3B">keyed by contentId — power-law skew</text>
    <text x="200" y="296" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1E5B3B">20M events/sec assumed peak</text>
    <text x="200" y="314" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#1E5B3B">capped below raw math — see article</text>

    <text x="200" y="358" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#3F6E58">Producers/consumers connect starting Day 4</text>
  </g>
</svg>
