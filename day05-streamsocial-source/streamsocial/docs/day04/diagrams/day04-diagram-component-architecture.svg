<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.30"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D3E7FB"/>
      <stop offset="100%" stop-color="#A9CDF3"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFF3DE"/>
      <stop offset="100%" stop-color="#A0E4C0"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD9D2"/>
      <stop offset="100%" stop-color="#FFB3A6"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3FBF6"/>
      <stop offset="100%" stop-color="#E4F5EA"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#2A2E35">One shared producer vs. a producer pool</text>

  <!-- TODAY panel: correct pattern -->
  <g transform="translate(40,60)">
    <rect x="0" y="0" width="380" height="270" rx="22" fill="url(#baseGrad)" stroke="#B7E0C6" stroke-width="1.5" filter="url(#strongShadow)"/>
    <text x="190" y="30" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1E5B3B">TODAY — what this module does</text>

    <rect x="24" y="54" width="332" height="40" rx="14" fill="url(#blueGrad)" filter="url(#softShadow)"/>
    <text x="190" y="74" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#1E4A7A">8 request threads (Tomcat)</text>

    <line x1="190" y1="94" x2="190" y2="120" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="90" y="120" width="200" height="56" rx="16" fill="url(#greenGrad)" filter="url(#strongShadow)"/>
    <text x="190" y="142" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#1E5B3B">ONE KafkaTemplate</text>
    <text x="190" y="160" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1E5B3B">shared, thread-safe</text>

    <line x1="190" y1="176" x2="190" y2="204" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="60" y="204" width="260" height="44" rx="14" fill="#ffffff" stroke="#7CB69A" stroke-width="1.6" filter="url(#softShadow)"/>
    <text x="190" y="222" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="600" fill="#1E5B3B">one large batch per partition</text>
    <text x="190" y="238" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#3F6E58">records from all 8 threads combined</text>
  </g>

  <!-- ANTI-PATTERN panel -->
  <g transform="translate(480,60)">
    <rect x="0" y="0" width="380" height="270" rx="22" fill="#FFF7F5" stroke="#F0B3A6" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="190" y="30" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#8A4A3E">THE INSTINCT TO RESIST — a producer pool</text>

    <rect x="24" y="54" width="332" height="40" rx="14" fill="url(#blueGrad)" filter="url(#softShadow)"/>
    <text x="190" y="74" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#1E4A7A">8 request threads (Tomcat)</text>

    <line x1="90" y1="94" x2="60" y2="120" stroke="#8592A6" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="190" y1="94" x2="190" y2="120" stroke="#8592A6" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="290" y1="94" x2="320" y2="120" stroke="#8592A6" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="30" y="120" width="90" height="40" rx="12" fill="url(#redGrad)" filter="url(#softShadow)"/>
    <text x="75" y="140" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="700" fill="#6B2E24">producer #1</text>

    <rect x="145" y="120" width="90" height="40" rx="12" fill="url(#redGrad)" filter="url(#softShadow)"/>
    <text x="190" y="140" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="700" fill="#6B2E24">producer #2</text>

    <rect x="260" y="120" width="90" height="40" rx="12" fill="url(#redGrad)" filter="url(#softShadow)"/>
    <text x="305" y="140" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="700" fill="#6B2E24">producer #8</text>
    <text x="305" y="155" text-anchor="middle" dominant-baseline="middle" font-size="8" fill="#6B2E24">(...5 more)</text>

    <line x1="75" y1="160" x2="75" y2="204" stroke="#8592A6" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="190" y1="160" x2="190" y2="204" stroke="#8592A6" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="305" y1="160" x2="305" y2="204" stroke="#8592A6" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="30" y="204" width="320" height="44" rx="14" fill="#ffffff" stroke="#E29A88" stroke-width="1.6"/>
    <text x="190" y="222" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="600" fill="#8A4A3E">8 small batches, 8x buffer.memory</text>
    <text x="190" y="238" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#8A4A3E">more requests, no throughput gain</text>
  </g>

  <!-- shared broker below -->
  <line x1="230" y1="330" x2="230" y2="380" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="330" x2="470" y2="380" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="380" width="500" height="90" rx="18" fill="url(#blueGrad)" filter="url(#softShadow)"/>
  <text x="450" y="410" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1E4A7A">user-actions (Day 3, 1000 partitions)</text>
  <text x="450" y="430" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#1E4A7A">Day 2's 3-broker cluster</text>
  <text x="450" y="450" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1E4A7A">both panels reach the same broker — the difference is what happens before the network call</text>

  <text x="450" y="510" text-anchor="middle" font-size="11" fill="#5B6472">JMH benchmark: ProducerThroughputBenchmark measures this gap directly, not by assertion.</text>
</svg>
