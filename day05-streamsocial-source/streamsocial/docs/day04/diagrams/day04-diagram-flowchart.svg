<svg viewBox="0 0 680 740" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D3E7FB"/>
      <stop offset="100%" stop-color="#A9CDF3"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0C2"/>
      <stop offset="100%" stop-color="#FFC38A"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFF3DE"/>
      <stop offset="100%" stop-color="#A0E4C0"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD9D2"/>
      <stop offset="100%" stop-color="#FFB3A6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="740" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#2A2E35">POST /api/v1/actions request flow</text>

  <rect x="220" y="56" width="240" height="48" rx="24" fill="url(#blueGrad)" filter="url(#softShadow)"/>
  <text x="340" y="80" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#1E4A7A">HTTP POST received</text>

  <line x1="340" y1="104" x2="340" y2="140" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision: valid -->
  <g transform="translate(340,208)">
    <polygon points="0,-64 140,0 0,64 -140,0" fill="#FBFBFB" stroke="#5B6472" stroke-width="1.8" filter="url(#strongShadow)"/>
    <text x="0" y="-6" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#2A2E35">Bean Validation</text>
    <text x="0" y="12" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#2A2E35">passes?</text>
  </g>

  <line x1="200" y1="208" x2="120" y2="208" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="196" text-anchor="middle" font-size="10" fill="#8A4A3E" font-weight="600">no</text>

  <rect x="0" y="182" width="180" height="52" rx="14" fill="url(#redGrad)" filter="url(#softShadow)"/>
  <text x="90" y="202" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#6B2E24">400 Bad Request</text>
  <text x="90" y="218" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#6B2E24">field errors returned</text>

  <line x1="480" y1="208" x2="560" y2="208" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="196" text-anchor="middle" font-size="10" fill="#2E6B4B" font-weight="600">yes</text>

  <rect x="560" y="182" width="110" height="52" rx="14" fill="url(#orangeGrad)" filter="url(#softShadow)"/>
  <text x="615" y="202" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#7A4A1E">build</text>
  <text x="615" y="216" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="700" fill="#7A4A1E">UserActionEvent</text>

  <line x1="615" y1="234" x2="615" y2="290" stroke="#8592A6" stroke-width="2"/>
  <line x1="615" y1="290" x2="380" y2="290" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="290" width="220" height="52" rx="14" fill="url(#blueGrad)" filter="url(#softShadow)"/>
  <text x="330" y="310" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#1E4A7A">kafkaTemplate.send(...)</text>
  <text x="330" y="326" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#1E4A7A">to the ONE shared producer</text>

  <line x1="330" y1="342" x2="330" y2="378" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="378" width="200" height="46" rx="14" fill="#F1F3F5" stroke="#B9C0CA" stroke-width="1.5"/>
  <text x="330" y="401" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#5B6472">block on future, timeout 2s</text>

  <line x1="330" y1="424" x2="330" y2="460" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision: acked -->
  <g transform="translate(330,528)">
    <polygon points="0,-64 140,0 0,64 -140,0" fill="#FBFBFB" stroke="#5B6472" stroke-width="1.8" filter="url(#strongShadow)"/>
    <text x="0" y="-6" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#2A2E35">Broker ack</text>
    <text x="0" y="12" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#2A2E35">received in time?</text>
  </g>

  <line x1="190" y1="528" x2="110" y2="528" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="516" text-anchor="middle" font-size="10" fill="#8A4A3E" font-weight="600">no</text>
  <rect x="0" y="502" width="200" height="52" rx="14" fill="url(#redGrad)" filter="url(#softShadow)"/>
  <text x="100" y="522" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#6B2E24">503 Service Unavailable</text>
  <text x="100" y="538" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#6B2E24">timeout or broker error</text>

  <line x1="470" y1="528" x2="550" y2="528" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="516" text-anchor="middle" font-size="10" fill="#2E6B4B" font-weight="600">yes</text>
  <rect x="550" y="502" width="120" height="52" rx="14" fill="url(#greenGrad)" filter="url(#softShadow)"/>
  <text x="610" y="522" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#1E5B3B">202 Accepted</text>
  <text x="610" y="538" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#1E5B3B">real partition + offset</text>

  <text x="340" y="620" text-anchor="middle" font-size="11" fill="#5B6472">The 202 body's partition/offset come from RecordMetadata — read off the ack, never invented by the controller.</text>
</svg>
