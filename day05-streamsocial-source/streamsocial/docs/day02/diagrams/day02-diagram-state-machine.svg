<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.26"/>
    </filter>
    <radialGradient id="blueGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#E3F0FD"/>
      <stop offset="100%" stop-color="#A9CDF3"/>
    </radialGradient>
    <radialGradient id="orangeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFEBD6"/>
      <stop offset="100%" stop-color="#FFC38A"/>
    </radialGradient>
    <radialGradient id="greenGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#DFF8E9"/>
      <stop offset="100%" stop-color="#9EE3BE"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#2A2E35">A single node's controller-role state machine</text>

  <!-- FOLLOWER -->
  <circle cx="130" cy="210" r="70" fill="url(#blueGrad)" filter="url(#strongShadow)"/>
  <text x="130" y="202" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1E4A7A">FOLLOWER</text>
  <text x="130" y="220" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#1E4A7A">voter, replicating</text>
  <text x="130" y="232" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#1E4A7A">the metadata log</text>

  <!-- CANDIDATE -->
  <circle cx="410" cy="120" r="66" fill="url(#orangeGrad)" filter="url(#strongShadow)"/>
  <text x="410" y="112" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#7A4A1E">CANDIDATE</text>
  <text x="410" y="130" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#7A4A1E">requesting votes</text>
  <text x="410" y="142" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#7A4A1E">from other voters</text>

  <!-- LEADER -->
  <circle cx="700" cy="210" r="70" fill="url(#greenGrad)" filter="url(#strongShadow)"/>
  <text x="700" y="200" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1E5B3B">LEADER</text>
  <text x="700" y="218" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#1E5B3B">this node is the</text>
  <text x="700" y="230" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#1E5B3B">active controller</text>

  <!-- OFFLINE -->
  <circle cx="410" cy="330" r="58" fill="#F1F3F5" stroke="#B9C0CA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="410" y="324" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#5B6472">OFFLINE</text>
  <text x="410" y="342" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#8A93A0">container killed</text>

  <!-- follower -> candidate -->
  <path d="M 175,168 C 250,120 320,110 344,108" fill="none" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="108" text-anchor="middle" font-size="9.5" fill="#5B6472">no leader heartbeat</text>

  <!-- candidate -> leader -->
  <path d="M 476,138 C 560,155 620,175 645,185" fill="none" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="145" text-anchor="middle" font-size="9.5" fill="#2E6B4B" font-weight="600">wins majority vote</text>

  <!-- candidate -> follower (lost election) -->
  <path d="M 358,158 C 260,190 190,195 175,205" fill="none" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="205" text-anchor="middle" font-size="9.5" fill="#5B6472">loses election</text>

  <!-- leader -> offline (this demo's kill) -->
  <path d="M 660,262 C 570,320 500,325 470,328" fill="none" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="300" text-anchor="middle" font-size="9.5" fill="#8A4A3E" font-weight="600">docker kill (today's demo)</text>

  <!-- offline -> follower (restart, rejoin) -->
  <path d="M 358,300 C 260,260 190,235 175,222" fill="none" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="260" text-anchor="middle" font-size="9.5" fill="#5B6472">restarted, rejoins as voter</text>

  <text x="410" y="392" text-anchor="middle" font-size="11" fill="#5B6472">At the cluster level, exactly one of the three nodes is ever LEADER at a time.</text>
</svg>
