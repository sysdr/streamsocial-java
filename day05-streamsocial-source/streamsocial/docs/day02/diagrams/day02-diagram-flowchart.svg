<svg viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a1a1a" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D3E7FB"/>
      <stop offset="100%" stop-color="#A9CDF3"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0C2"/>
      <stop offset="100%" stop-color="#FFC38A"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFF3DE"/>
      <stop offset="100%" stop-color="#A0E4C0"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD9D2"/>
      <stop offset="100%" stop-color="#FFB3A6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="720" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#2A2E35">Cluster bring-up and verification flow</text>

  <!-- start -->
  <rect x="220" y="56" width="240" height="48" rx="24" fill="url(#blueGrad)" filter="url(#softShadow)"/>
  <text x="340" y="80" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="600" fill="#1E4A7A">docker compose up -d</text>

  <line x1="340" y1="104" x2="340" y2="136" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- format + join -->
  <rect x="170" y="136" width="340" height="56" rx="16" fill="url(#orangeGrad)" filter="url(#softShadow)"/>
  <text x="340" y="158" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#7A4A1E">Each node formats storage (shared CLUSTER_ID)</text>
  <text x="340" y="176" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#7A4A1E">and joins the Raft controller quorum</text>

  <line x1="340" y1="192" x2="340" y2="228" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision: healthy -->
  <g transform="translate(340,300)">
    <polygon points="0,-68 145,0 0,68 -145,0" fill="#FBFBFB" stroke="#5B6472" stroke-width="1.8" filter="url(#strongShadow)"/>
    <text x="0" y="-8" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#2A2E35">All 3 brokers</text>
    <text x="0" y="10" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#2A2E35">report healthy?</text>
  </g>

  <!-- retry loop (no) -->
  <path d="M 195,300 C 90,300 90,220 195,192" fill="none" stroke="#C9776A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="118" y="230" text-anchor="middle" font-size="10" fill="#8A4A3E" font-weight="600">not yet — retry (up to 60s)</text>

  <line x1="340" y1="368" x2="340" y2="404" stroke="#5FAE84" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="392" text-anchor="middle" font-size="10.5" fill="#2E6B4B" font-weight="600">yes</text>

  <!-- cluster ready -->
  <rect x="220" y="404" width="240" height="48" rx="24" fill="url(#greenGrad)" filter="url(#softShadow)"/>
  <text x="340" y="428" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="700" fill="#1E5B3B">Cluster ready</text>

  <line x1="340" y1="452" x2="340" y2="486" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- branch to two scripts -->
  <line x1="340" y1="486" x2="170" y2="530" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="486" x2="510" y2="530" stroke="#8592A6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="30" y="530" width="280" height="70" rx="16" fill="#FBFDFB" stroke="#B7E0C6" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="170" y="554" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#1E5B3B">verify-cluster.sh</text>
  <text x="170" y="572" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#3F6E58">broker API check +</text>
  <text x="170" y="586" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#3F6E58">describe --status</text>

  <rect x="370" y="530" width="280" height="70" rx="16" fill="#FFF7F0" stroke="#F0C79A" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="510" y="554" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#7A4A1E">demo-failover.sh</text>
  <text x="510" y="572" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#7A4A1E">kill active controller,</text>
  <text x="510" y="586" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#7A4A1E">confirm new LeaderId</text>

  <text x="340" y="660" text-anchor="middle" font-size="11" fill="#5B6472">Today's challenge lives entirely in the right-hand branch — losing a node doesn't stall the cluster.</text>
</svg>
