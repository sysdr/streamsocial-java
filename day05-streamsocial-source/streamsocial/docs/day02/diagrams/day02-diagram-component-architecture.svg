<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.16"/>
    </filter>
    <filter id="strongShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.30"/>
    </filter>
    <radialGradient id="greenGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#DFF8E9"/>
      <stop offset="100%" stop-color="#9EE3BE"/>
    </radialGradient>
    <radialGradient id="orangeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFEBD6"/>
      <stop offset="100%" stop-color="#FFB765"/>
    </radialGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3FBF6"/>
      <stop offset="100%" stop-color="#E4F5EA"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#2A2E35">StreamSocial's Kafka cluster — 3 brokers, KRaft mode</text>

  <!-- Day 1 pill, faded, foundation reference -->
  <rect x="360" y="52" width="180" height="36" rx="18" fill="#F1F3F5" stroke="#B9C0CA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="70" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#5B6472">streamsocial-common (Day 1)</text>
  <line x1="450" y1="88" x2="450" y2="118" stroke="#B9C0CA" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="450" y="105" text-anchor="middle" font-size="9" fill="#8A93A0">events will flow here — Day 4</text>

  <!-- TODAY panel -->
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="780" height="400" rx="24" fill="url(#baseGrad)" stroke="#B7E0C6" stroke-width="1.5" filter="url(#strongShadow)"/>
    <text x="390" y="34" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="700" fill="#1E5B3B">TODAY — streamsocial-infra</text>
    <text x="390" y="54" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#3F6E58">controller.quorum.voters = {1, 2, 3} — any 2 form a majority</text>

    <!-- raft consensus triangle lines -->
    <line x1="390" y1="150" x2="200" y2="300" stroke="#B9C0CA" stroke-width="1.6" stroke-dasharray="3 3"/>
    <line x1="390" y1="150" x2="580" y2="300" stroke="#B9C0CA" stroke-width="1.6" stroke-dasharray="3 3"/>
    <line x1="200" y1="300" x2="580" y2="300" stroke="#B9C0CA" stroke-width="1.6" stroke-dasharray="3 3"/>
    <text x="390" y="228" text-anchor="middle" font-size="9.5" fill="#8A93A0">Raft metadata quorum</text>

    <!-- kafka-1 : active controller, highlighted -->
    <g transform="translate(390,150)">
      <circle cx="0" cy="0" r="70" fill="url(#orangeGrad)" filter="url(#strongShadow)"/>
      <text x="0" y="-16" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#7A4A1E">kafka-1</text>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#7A4A1E">broker :9092</text>
      <text x="0" y="14" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#7A4A1E">controller :9093</text>
      <text x="0" y="32" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="700" fill="#7A4A1E">ACTIVE CONTROLLER</text>
    </g>

    <!-- kafka-2 : voter -->
    <g transform="translate(200,300)">
      <circle cx="0" cy="0" r="62" fill="url(#greenGrad)" filter="url(#softShadow)"/>
      <text x="0" y="-14" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1E5B3B">kafka-2</text>
      <text x="0" y="2" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#1E5B3B">broker :9092</text>
      <text x="0" y="16" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#1E5B3B">controller :9093</text>
      <text x="0" y="32" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1E5B3B">voter (follower)</text>
    </g>

    <!-- kafka-3 : voter -->
    <g transform="translate(580,300)">
      <circle cx="0" cy="0" r="62" fill="url(#greenGrad)" filter="url(#softShadow)"/>
      <text x="0" y="-14" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#1E5B3B">kafka-3</text>
      <text x="0" y="2" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#1E5B3B">broker :9092</text>
      <text x="0" y="16" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#1E5B3B">controller :9093</text>
      <text x="0" y="32" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1E5B3B">voter (follower)</text>
    </g>

    <text x="390" y="378" text-anchor="middle" font-size="11" fill="#3F6E58">kill kafka-1's container and kafka-2/kafka-3 elect a new ACTIVE CONTROLLER — no ZooKeeper anywhere</text>
  </g>

  <!-- future clients, dashed -->
  <rect x="360" y="540" width="180" height="40" rx="18" fill="#F1F3F5" stroke="#B9C0CA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="556" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="#5B6472">producers / consumers</text>
  <text x="450" y="571" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#8A93A0">arrive Day 4</text>
  <line x1="450" y1="520" x2="450" y2="538" stroke="#B9C0CA" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
